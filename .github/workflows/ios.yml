name: iOS

on:
  push:
    branches:
      - main
      - port/cdda-experimental-2026-10-30-2308
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

# A full build takes a while; let a running build finish (and report) and
# queue the newest push behind it rather than cancelling it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check_upstream:
    if: github.event_name == 'schedule'
    name: Check for a new upstream experimental release
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      upstream_ref: ${{ steps.check.outputs.upstream_ref }}
      upstream_commit: ${{ steps.check.outputs.upstream_commit }}
      translations_sha256: ${{ steps.check.outputs.translations_sha256 }}
      graphics_sha256: ${{ steps.check.outputs.graphics_sha256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-upstream-release.sh

  build:
    needs: check_upstream
    if: always() && (github.event_name != 'schedule' || needs.check_upstream.outputs.should_build == 'true')
    name: ${{ matrix.name }}
    runs-on: macos-15
    timeout-minutes: 300
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Simulator build and smoke test
            platform: iphonesimulator
          - name: Device build (unsigned IPA)
            platform: iphoneos
    env:
      USE_CCACHE: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3G
      CCACHE_COMPRESS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Pin upstream release for this scheduled build
        if: github.event_name == 'schedule'
        env:
          UPSTREAM_REF: ${{ needs.check_upstream.outputs.upstream_ref }}
          UPSTREAM_COMMIT: ${{ needs.check_upstream.outputs.upstream_commit }}
          TRANSLATIONS_SHA256: ${{ needs.check_upstream.outputs.translations_sha256 }}
          GRAPHICS_SHA256: ${{ needs.check_upstream.outputs.graphics_sha256 }}
        run: |
          python3 - "$GITHUB_WORKSPACE/cdda.env" <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          values = {
              "CDDA_REF": (os.environ["UPSTREAM_REF"], r"cdda-experimental-\d{4}-\d{2}-\d{2}-\d{4}"),
              "CDDA_COMMIT": (os.environ["UPSTREAM_COMMIT"], r"[0-9a-f]{40}"),
              "CDDA_VERSION_STRING": (os.environ["UPSTREAM_REF"], r"cdda-experimental-\d{4}-\d{2}-\d{2}-\d{4}"),
              "CDDA_TRANSLATIONS_SHA256": (os.environ["TRANSLATIONS_SHA256"], r"[0-9a-f]{64}"),
              "CDDA_GRAPHICS_SHA256": (os.environ["GRAPHICS_SHA256"], r"[0-9a-f]{64}"),
          }
          text = path.read_text()
          for key, (value, pattern) in values.items():
              if re.fullmatch(pattern, value) is None:
                  raise SystemExit(f"invalid value for {key}")
              expression = re.compile(rf"^{key}=.*$", re.MULTILINE)
              text, count = expression.subn(f"{key}={value}", text)
              if count != 1:
                  raise SystemExit(f"expected exactly one {key} entry in cdda.env")
          path.write_text(text)
          PY

      - name: Show toolchain
        run: |
          xcodebuild -version
          cmake --version | head -1
          gh --version | head -1
          sysctl -n hw.ncpu hw.memsize

      - name: Install build tools
        run: brew install ccache gh ninja gettext

      - name: Fetch Cataclysm source
        run: scripts/fetch-cdda.sh

      - name: Restore CC-Sounds archive
        id: soundpack-cache
        uses: actions/cache/restore@v4
        with:
          path: build/soundpack
          key: cdda-soundpack-${{ hashFiles('soundpack.env') }}

      - name: Install CC-Sounds soundpack
        run: bash scripts/fetch-soundpack.sh

      - name: Save CC-Sounds archive
        if: matrix.platform == 'iphoneos' && steps.soundpack-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/soundpack
          key: ${{ steps.soundpack-cache.outputs.cache-primary-key }}

      - name: Restore upstream graphics archive
        id: graphics-cache
        uses: actions/cache/restore@v4
        with:
          path: build/graphics
          key: cdda-graphics-${{ needs.check_upstream.outputs.upstream_ref || hashFiles('cdda.env') }}

      - name: Install official graphics assets
        run: bash scripts/fetch-graphics.sh

      - name: Save upstream graphics archive
        if: matrix.platform == 'iphoneos' && steps.graphics-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/graphics
          key: ${{ steps.graphics-cache.outputs.cache-primary-key }}

      - name: Restore SDL3 libraries
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: deps/install/${{ matrix.platform }}
          key: sdl3-deps-${{ matrix.platform }}-${{ runner.os }}-${{ hashFiles('scripts/build-deps.sh') }}

      - name: Build SDL3 libraries
        if: steps.deps.outputs.cache-hit != 'true'
        run: scripts/build-deps.sh ${{ matrix.platform }}

      - name: Save SDL3 libraries
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: deps/install/${{ matrix.platform }}
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Restore upstream translation archive
        id: translations-cache
        uses: actions/cache/restore@v4
        with:
          path: build/translations
          key: cdda-translations-${{ needs.check_upstream.outputs.upstream_ref || hashFiles('cdda.env') }}

      - name: Compile translations
        run: scripts/compile-translations.sh

      - name: Save upstream translation archive
        if: matrix.platform == 'iphoneos' && steps.translations-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/translations
          key: ${{ steps.translations-cache.outputs.cache-primary-key }}

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ matrix.platform }}-

      - name: Build Cataclysm.app
        id: build
        run: scripts/build-app.sh ${{ matrix.platform }} Release

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Compiler cache statistics
        if: always()
        run: ccache -s || true

      - name: Smoke test in the iOS Simulator
        if: matrix.platform == 'iphonesimulator'
        env:
          SMOKE_PRINT_SCREENSHOTS: "1"
        run: scripts/simulator-smoke-test.sh build/iphonesimulator/Release-iphonesimulator/Cataclysm.app dist/smoke-test

      - name: Smoke test in the iPad Simulator
        if: ${{ !cancelled() && matrix.platform == 'iphonesimulator' && steps.build.outcome == 'success' }}
        env:
          SMOKE_DEVICE_KIND: ipad
          SMOKE_PRINT_SCREENSHOTS: "1"
        run: scripts/simulator-smoke-test.sh build/iphonesimulator/Release-iphonesimulator/Cataclysm.app dist/smoke-test-ipad

      - name: Upload smoke test results
        if: always() && matrix.platform == 'iphonesimulator'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: |
            dist/smoke-test
            dist/smoke-test-ipad
          if-no-files-found: ignore

      - name: Package unsigned IPA
        if: matrix.platform == 'iphoneos'
        run: scripts/package-ipa.sh build/iphoneos/Release-iphoneos/Cataclysm.app

      - name: Publish IPA to GitHub Releases
        if: matrix.platform == 'iphoneos' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          source cdda.env
          release_tag="ios-build-${GITHUB_RUN_NUMBER}"
          ipa="dist/Cataclysm-${CDDA_VERSION_STRING}-unsigned.ipa"
          release_ipa="dist/Cataclysm-iOS-${CDDA_VERSION_STRING}-build-${GITHUB_RUN_NUMBER}-unsigned.ipa"
          test -s "$ipa"
          cp "$ipa" "$release_ipa"
          sha256="$(shasum -a 256 "$release_ipa" | awk '{print $1}')"
          title="$CDDA_VERSION_STRING"
          notes="$(printf '## Download the IPA\n\nDownload the `Cataclysm-iOS-...-unsigned.ipa` file from the Assets section below.\n\nThis IPA is unsigned. Sign and install it with a sideloading tool such as AltStore or Sideloadly using your Apple ID.\n\nGame version: %s\nSHA-256: `%s`' "$CDDA_VERSION_STRING" "$sha256")"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" "$release_ipa" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --notes "$notes" \
              --prerelease
          else
            gh release create "$release_tag" "$release_ipa" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes" \
              --prerelease
          fi

  update-upstream-pin:
    needs:
      - check_upstream
      - build
    if: github.event_name == 'schedule' && needs.check_upstream.outputs.should_build == 'true'
    name: Update the pinned upstream version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update cdda.env
        env:
          UPSTREAM_REF: ${{ needs.check_upstream.outputs.upstream_ref }}
          UPSTREAM_COMMIT: ${{ needs.check_upstream.outputs.upstream_commit }}
          TRANSLATIONS_SHA256: ${{ needs.check_upstream.outputs.translations_sha256 }}
          GRAPHICS_SHA256: ${{ needs.check_upstream.outputs.graphics_sha256 }}
        run: |
          python3 - "$GITHUB_WORKSPACE/cdda.env" <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          values = {
              "CDDA_REF": os.environ["UPSTREAM_REF"],
              "CDDA_COMMIT": os.environ["UPSTREAM_COMMIT"],
              "CDDA_VERSION_STRING": os.environ["UPSTREAM_REF"],
              "CDDA_TRANSLATIONS_SHA256": os.environ["TRANSLATIONS_SHA256"],
              "CDDA_GRAPHICS_SHA256": os.environ["GRAPHICS_SHA256"],
          }
          text = path.read_text()
          for key, value in values.items():
              expression = re.compile(rf"^{key}=.*$", re.MULTILINE)
              text, count = expression.subn(f"{key}={value}", text)
              if count != 1:
                  raise SystemExit(f"expected exactly one {key} entry in cdda.env")
          path.write_text(text)
          PY

      - name: Commit updated upstream pin
        run: |
          if git diff --quiet -- cdda.env; then
            echo "cdda.env already pins this upstream release."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cdda.env
          git commit -m "Pin upstream ${{ needs.check_upstream.outputs.upstream_ref }} after successful iOS build"
          git push origin HEAD:main
