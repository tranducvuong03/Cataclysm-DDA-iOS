name: iOS

on:
  push:
    branches:
      - main
      - port/cdda-experimental-2026-10-30-2308
  pull_request:
  workflow_dispatch:

# A full build takes a while; let a running build finish (and report) and
# queue the newest push behind it rather than cancelling it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: macos-15
    timeout-minutes: 300
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Simulator build and smoke test
            platform: iphonesimulator
          - name: Device build (unsigned IPA)
            platform: iphoneos
    env:
      USE_CCACHE: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3G
      CCACHE_COMPRESS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          cmake --version | head -1
          gh --version | head -1
          sysctl -n hw.ncpu hw.memsize

      - name: Install build tools
        run: brew install ccache gh ninja gettext

      - name: Fetch Cataclysm source
        run: scripts/fetch-cdda.sh

      - name: Restore upstream graphics archive
        id: graphics-cache
        uses: actions/cache/restore@v4
        with:
          path: build/graphics
          key: cdda-graphics-${{ hashFiles('cdda.env') }}

      - name: Install official tilesets
        run: bash scripts/fetch-graphics.sh

      - name: Save upstream graphics archive
        if: matrix.platform == 'iphoneos' && steps.graphics-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/graphics
          key: ${{ steps.graphics-cache.outputs.cache-primary-key }}

      - name: Restore SDL3 libraries
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: deps/install/${{ matrix.platform }}
          key: sdl3-deps-${{ matrix.platform }}-${{ runner.os }}-${{ hashFiles('scripts/build-deps.sh') }}

      - name: Build SDL3 libraries
        if: steps.deps.outputs.cache-hit != 'true'
        run: scripts/build-deps.sh ${{ matrix.platform }}

      - name: Save SDL3 libraries
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: deps/install/${{ matrix.platform }}
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Restore upstream translation archive
        id: translations-cache
        uses: actions/cache/restore@v4
        with:
          path: build/translations
          key: cdda-translations-${{ hashFiles('cdda.env') }}

      - name: Compile translations
        run: scripts/compile-translations.sh

      - name: Save upstream translation archive
        if: matrix.platform == 'iphoneos' && steps.translations-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/translations
          key: ${{ steps.translations-cache.outputs.cache-primary-key }}

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ matrix.platform }}-

      - name: Build Cataclysm.app
        id: build
        run: scripts/build-app.sh ${{ matrix.platform }} Release

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Compiler cache statistics
        if: always()
        run: ccache -s || true

      - name: Smoke test in the iOS Simulator
        if: matrix.platform == 'iphonesimulator'
        env:
          SMOKE_PRINT_SCREENSHOTS: "1"
        run: scripts/simulator-smoke-test.sh build/iphonesimulator/Release-iphonesimulator/Cataclysm.app dist/smoke-test

      - name: Smoke test in the iPad Simulator
        if: ${{ !cancelled() && matrix.platform == 'iphonesimulator' && steps.build.outcome == 'success' }}
        env:
          SMOKE_DEVICE_KIND: ipad
          SMOKE_PRINT_SCREENSHOTS: "1"
        run: scripts/simulator-smoke-test.sh build/iphonesimulator/Release-iphonesimulator/Cataclysm.app dist/smoke-test-ipad

      - name: Upload smoke test results
        if: always() && matrix.platform == 'iphonesimulator'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: |
            dist/smoke-test
            dist/smoke-test-ipad
          if-no-files-found: ignore

      - name: Package unsigned IPA
        if: matrix.platform == 'iphoneos'
        run: scripts/package-ipa.sh build/iphoneos/Release-iphoneos/Cataclysm.app

      - name: Publish IPA to GitHub Releases
        if: matrix.platform == 'iphoneos' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          source cdda.env
          release_tag="ios-build-${GITHUB_RUN_NUMBER}"
          ipa="dist/Cataclysm-${CDDA_VERSION_STRING}-unsigned.ipa"
          release_ipa="dist/Cataclysm-iOS-${CDDA_VERSION_STRING}-build-${GITHUB_RUN_NUMBER}-unsigned.ipa"
          test -s "$ipa"
          cp "$ipa" "$release_ipa"
          sha256="$(shasum -a 256 "$release_ipa" | awk '{print $1}')"
          title="Cataclysm DDA iOS (build #${GITHUB_RUN_NUMBER})"
          notes="$(printf '## ⬇ Tải IPA\n\nTrong mục **Assets** bên dưới, tải file có tên `Cataclysm-iOS-...-unsigned.ipa`.\n\nĐây là IPA chưa ký. Dùng AltStore, Sideloadly hoặc công cụ sideload khác để ký và cài bằng Apple ID.\n\nGame: %s\nCommit: %s\nSHA-256: `%s`' "$CDDA_VERSION_STRING" "$GITHUB_SHA" "$sha256")"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" "$release_ipa" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$release_tag" "$release_ipa" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes"
          fi
